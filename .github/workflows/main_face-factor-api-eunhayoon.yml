name: Build and deploy Docker app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: face-factor-api-eunhayoon_group
  AZURE_WEBAPP_NAME: face-factor-api-eunhayoon
  ACR_NAME: facefactoracracr
  ACR_LOGIN_SERVER: facefactoracracr.azurecr.io
  IMAGE_NAME: face-factor-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_782C9475751B441D8C0ECD437B7A32A1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E7F6031D55364D95B4862F97AABCFEE1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AF64AA7346F0428999D0938CB4E858F9 }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build Docker image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}" \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"

      - name: Point App Service to new image
        run: az webapp config container set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --container-image-name "$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}" --container-registry-url "https://$ACR_LOGIN_SERVER"

      - name: Restart App Service
        run: az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME"

      - name: Verify deployed API
        shell: bash
        run: |
          HOST=$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query defaultHostName --output tsv)
          echo "Waiting for https://$HOST/docs"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error "https://$HOST/docs" > /dev/null; then
              echo "Deployment verification passed."
              exit 0
            fi

            echo "Attempt $attempt/30 failed; retrying in 10 seconds..."
            sleep 10
          done

          echo "Deployment verification failed."
          exit 1
